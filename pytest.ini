[pytest]
addopts = --basetemp=tmp/pytest
testpaths = tests
filterwarnings =
    # statsmodels 0.14.x reshapes endog in place; NumPy 2.5 deprecates this setter.
    # Keep convergence warnings and all other deprecations visible.
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\.5\.:DeprecationWarning:statsmodels\.tsa\.statespace\.mlemodel
